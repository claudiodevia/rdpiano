# Based on https://github.com/OwlPlug/owlplug-scanner/blob/master/.github/workflows/main.yml
name: RdPiano

on: 
  push:
    branches: 
      - '**'

jobs:
  test-core:
    name: "Núcleo: pruebas (ctest)"
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
    - name: "Configurar librdpiano"
      run: cmake -S librdpiano -B librdpiano/build -DRDPIANO_SANITIZE=OFF -DCMAKE_BUILD_TYPE=Release
      shell: bash
    - name: "Compilar las pruebas"
      run: cmake --build librdpiano/build --target rdpiano_tests rdpiano_e2e
      shell: bash
    # `unit` es la suite por unidades; `e2e` compara un hash bit-exacto por
    # parche contra el golden versionado. Si el audio cambia sin querer, esto
    # lo para antes de que llegue a un release.
    - name: "ctest"
      run: ctest --test-dir librdpiano/build --output-on-failure
      shell: bash

  build-osx:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download JUCE"
      run: bash -ex ./rdpiano_juce/download-juce.sh
      shell: bash
    - name: "Build macOS"
      run: sh -ex ./rdpiano_juce/build/build-osx.sh
      shell: bash
    - name: "zip macOS"
      run: |
           cd ./rdpiano_juce/Builds/MacOSX/build/Release/
           zip -r rdpiano_juce.vst3.macOS.zip rdpiano_juce.vst3
           zip -r rdpiano_juce.component.macOS.zip rdpiano_juce.component
           zip -r rdpiano_juce.app.macOS.zip rdpiano_juce.app
           cd -
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RdPiano-osx
        path: |
              ./rdpiano_juce/Builds/MacOSX/build/Release/rdpiano_juce.vst3.macOS.zip
              ./rdpiano_juce/Builds/MacOSX/build/Release/rdpiano_juce.component.macOS.zip
              ./rdpiano_juce/Builds/MacOSX/build/Release/rdpiano_juce.app.macOS.zip

  release:
    name: "Release"
    needs: [test-core, build-osx]
    if: github.ref == 'refs/heads/master'
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v3.3.0
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./rdpiano_juce/build
          pattern: "*"
          merge-multiple: true
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          automatic_release_tag: latest
          title: RdPiano Latest
          files: |
                 rdpiano_juce/build/**/*
