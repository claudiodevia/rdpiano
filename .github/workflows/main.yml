# Based on https://github.com/OwlPlug/owlplug-scanner/blob/master/.github/workflows/main.yml
name: RdPiano

on: 
  push:
    branches: 
      - '**'

# El mínimo para todo el workflow; el job `release` se sube a `contents: write`
# por su cuenta. Sin este bloque, cada job heredaría los permisos por omisión
# del repositorio.
permissions:
  contents: read

jobs:
  # Los tres trabajos de prueba llaman a scripts/verificar.sh, cada uno con su
  # modo: lo que corre aquí es lo mismo que corre en local. La salida de las
  # herramientas va a logs/, que se sube si algo falla.
  test-core:
    name: "Núcleo: pruebas (ctest)"
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7.0.1
    # Solo para compilar rdpiano_standalone, el ejecutable de escucha: sin
    # ellos CMake lo omite y lo demás sigue igual.
    - name: "Instalar SDL2 y portmidi"
      run: brew install sdl2 portmidi
      shell: bash
    # `unit` es la suite por unidades; `e2e` compara un hash bit-exacto por
    # parche contra el golden versionado. Si el audio cambia sin querer, esto
    # lo para antes de que llegue a un release.
    - name: "Compilar y pasar las pruebas"
      run: sh ./scripts/verificar.sh nucleo
      shell: bash
    - name: "Subir los logs"
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: logs-nucleo
        path: logs/

  test-core-asan:
    name: "Núcleo: pruebas con ASan"
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7.0.1
    # La misma red, con AddressSanitizer. El harness tarda ~40 s en vez de ~3,
    # pero es lo que caza los desbordes que un hash idéntico no ve.
    - name: "Compilar y pasar las pruebas con ASan"
      run: sh ./scripts/verificar.sh asan
      shell: bash
    - name: "Subir los logs"
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: logs-asan
        path: logs/

  build-osx:
    name: "Plugin: cinco formatos y pruebas"
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Descargar JUCE"
      run: sh ./scripts/download-juce.sh
      shell: bash
    # build-osx.sh ALL (los cinco formatos) y las pruebas del plugin, una app de
    # consola del mismo build.
    - name: "Compilar el plugin y pasar sus pruebas"
      run: sh ./scripts/verificar.sh plugin
      shell: bash
    - name: "Subir los logs"
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: logs-plugin
        path: logs/
    - name: "Empaquetar en zip"
      run: |
           # Cada bundle en la raíz de su zip: la API CMake de JUCE los deja
           # en un subdirectorio por formato.
           OUT=$PWD/build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release
           (cd "$OUT/VST3" && zip -r "$OUT/rdpiano_juce.vst3.macOS.zip" rdpiano_juce.vst3)
           (cd "$OUT/AU" && zip -r "$OUT/rdpiano_juce.component.macOS.zip" rdpiano_juce.component)
           (cd "$OUT/Standalone" && zip -r "$OUT/rdpiano_juce.app.macOS.zip" rdpiano_juce.app)
           (cd "$OUT/LV2" && zip -r "$OUT/rdpiano_juce.lv2.macOS.zip" rdpiano_juce.lv2)
      shell: bash
    - name: "Subir los productos"
      uses: actions/upload-artifact@v7.0.1
      with:
        name: RdPiano-osx
        path: |
              ./build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release/rdpiano_juce.vst3.macOS.zip
              ./build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release/rdpiano_juce.component.macOS.zip
              ./build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release/rdpiano_juce.app.macOS.zip
              ./build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release/rdpiano_juce.lv2.macOS.zip

  release:
    name: "Release"
    needs: [test-core, test-core-asan, build-osx]
    if: github.ref == 'refs/heads/master'
    runs-on: "ubuntu-latest"
    # Publicar la release rodante es lo único que necesita escribir.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Descargar los productos"
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./build/release
          pattern: "RdPiano-*"
          merge-multiple: true
      # Archivada desde 2024 y con runtime node12: no hay versión más alta a
      # la que subir. Va fijada al SHA de v1.2.1, no a una etiqueta: `@latest`
      # —y también `@v1.2.1`— es un puntero mutable en un repositorio de
      # terceros, y este paso corre con permiso de escritura sobre las
      # releases que descargan los usuarios. Migrar a
      # `softprops/action-gh-release` es lo que toca, pero cambia la semántica
      # del release rodante: ésta reescribe el tag `latest` en cada ejecución
      # y aquélla no lo mueve si ya existe.
      - uses: "marvinpinto/action-automatic-releases@919008cf3f741b179569b7a6fb4d8860689ab7f0" # v1.2.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          automatic_release_tag: latest
          title: RdPiano Latest
          files: |
                 build/release/**/*
