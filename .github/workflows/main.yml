# Based on https://github.com/OwlPlug/owlplug-scanner/blob/master/.github/workflows/main.yml
name: RdPiano

on: 
  push:
    branches: 
      - '**'

jobs:
  test-core:
    name: "Núcleo: pruebas (ctest)"
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
    - name: "Configurar librdpiano"
      run: cmake -S librdpiano -B build/core -DRDPIANO_SANITIZE=OFF -DCMAKE_BUILD_TYPE=Release
      shell: bash
    - name: "Compilar las pruebas"
      run: cmake --build build/core --target rdpiano_tests rdpiano_e2e
      shell: bash
    # `unit` es la suite por unidades; `e2e` compara un hash bit-exacto por
    # parche contra el golden versionado. Si el audio cambia sin querer, esto
    # lo para antes de que llegue a un release.
    - name: "ctest"
      run: ctest --test-dir build/core --output-on-failure
      shell: bash

  test-core-asan:
    name: "Núcleo: pruebas con ASan"
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
    # La misma red, con AddressSanitizer. El harness tarda ~40 s en vez de ~3,
    # pero es lo que caza los desbordes que un hash idéntico no ve
    # (REFACTORIZACION §16.2).
    - name: "Configurar librdpiano con ASan"
      run: cmake -S librdpiano -B build/core-asan -DRDPIANO_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      shell: bash
    - name: "Compilar las pruebas"
      run: cmake --build build/core-asan --target rdpiano_tests rdpiano_e2e
      shell: bash
    - name: "ctest"
      run: ctest --test-dir build/core-asan --output-on-failure
      shell: bash

  build-osx:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download JUCE"
      run: bash -ex ./scripts/download-juce.sh
      shell: bash
    # Desde la fase 3 el plugin sale del CMakeLists de la raíz, no del
    # Projucer (REFACTORIZACION §16.3). El script sigue siendo el mismo punto
    # de entrada; ALL son los cinco formatos —el script exige el argumento, no
    # tiene defecto.
    - name: "Build macOS"
      run: bash -ex ./scripts/build-osx.sh ALL
      shell: bash
    # La ida y vuelta de presets: es una app de consola del mismo build, así
    # que aquí ya está compilada la mitad de lo que necesita.
    - name: "Pruebas del plugin"
      run: |
           cmake --build build/plugin --config Release --target rdpiano_plugin_tests
           ctest --test-dir build/plugin -C Release -R plugin_state --output-on-failure
      shell: bash
    - name: "zip macOS"
      run: |
           # Cada bundle en la raíz de su zip, como antes de la fase 3: la
           # API CMake de JUCE los deja en un subdirectorio por formato.
           OUT=$PWD/build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release
           (cd "$OUT/VST3" && zip -r "$OUT/rdpiano_juce.vst3.macOS.zip" rdpiano_juce.vst3)
           (cd "$OUT/AU" && zip -r "$OUT/rdpiano_juce.component.macOS.zip" rdpiano_juce.component)
           (cd "$OUT/Standalone" && zip -r "$OUT/rdpiano_juce.app.macOS.zip" rdpiano_juce.app)
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RdPiano-osx
        path: |
              ./build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release/rdpiano_juce.vst3.macOS.zip
              ./build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release/rdpiano_juce.component.macOS.zip
              ./build/plugin/rdpiano_juce/rdpiano_juce_artefacts/Release/rdpiano_juce.app.macOS.zip

  release:
    name: "Release"
    needs: [test-core, test-core-asan, build-osx]
    if: github.ref == 'refs/heads/master'
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v3.3.0
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./build/release
          pattern: "*"
          merge-multiple: true
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          automatic_release_tag: latest
          title: RdPiano Latest
          files: |
                 build/release/**/*
